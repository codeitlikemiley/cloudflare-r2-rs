name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --locked

      # Live tests are #[ignore]d, so this stays offline. tests/offline_http.rs
      # binds a loopback port; nothing leaves the machine.
      - name: Test
        run: cargo test --all-features --locked

      - name: Documentation
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Package
        run: cargo package --locked

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Dictated by aws-sdk-s3; keep in sync with rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      # Deliberately without --locked: this catches an MSRV break introduced by
      # a freshly-resolved dependency, not just by the pinned lockfile.
      - run: cargo check --all-targets
