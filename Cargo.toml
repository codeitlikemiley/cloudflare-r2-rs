[package]
name = "cloudflare-r2-rs"
version = "0.2.0"
edition = "2021"
# Set by aws-sdk-s3, which requires 1.94.1.
rust-version = "1.94.1"
description = "A fully featured, ergonomic Rust SDK for Cloudflare R2 object storage"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codeitlikemiley/cloudflare-r2-rs"
homepage = "https://github.com/codeitlikemiley/cloudflare-r2-rs"
documentation = "https://docs.rs/cloudflare-r2-rs"
readme = "README.md"
keywords = ["cloudflare", "r2", "s3", "storage", "sdk"]
categories = ["api-bindings", "web-programming", "filesystem"]
exclude = ["/.github", "/examples"]

[dependencies]
aws-sdk-s3 = { version = "1.140", features = ["behavior-version-latest"] }
tokio = { version = "1.0.0", features = ["rt", "macros", "fs", "io-util", "sync"] }
futures = "0.3.30"
mime_guess = "2.0.4"
thiserror = "1.0.63"
log = "0.4.21"

[dev-dependencies]
tokio = { version = "1.0.0", features = ["rt-multi-thread", "macros", "fs"] }
dotenv = "0.15.0"
tempfile = "3.10"
